<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - SmartSignal Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0a0a12;
            --bg-secondary: #0f1525;
            --card-border: #00a86b;
            --text-primary: #e0e0e0;
            --header-bg: #0d1b2a;
            --header-text: #00d084;
            --button-bg: #00a86b;
            --button-hover: #00c88b;
            --danger-bg: #d00;
            --danger-hover: #a00;
            --font-main: 'Courier New', 'Lucida Console', monospace;
            --font-headers: 'Orbitron', 'Arial', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            font-family: var(--font-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .admin-container {
            max-width: 800px;
            width: 100%;
            padding: 20px;
            background: var(--bg-secondary);
            border: 2px solid var(--card-border);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,168,107,0.25);
        }

        .admin-header {
            background: var(--header-bg);
            color: var(--header-text);
            padding: 16px;
            text-align: center;
            font-size: 1.5em;
            font-weight: 600;
            font-family: var(--font-headers);
            border-radius: 8px 8px 0 0;
            margin: -20px -20px 20px -20px;
        }

        #loginSection, #adminPanel {
            width: 100%;
        }

        input {
            padding: 10px;
            margin: 8px 0;
            width: 100%;
            border: 1px solid #555;
            border-radius: 6px;
            font-size: 16px;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-main);
            box-sizing: border-box;
        }

        button {
            padding: 10px 15px;
            margin: 8px 0;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-family: var(--font-headers);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .btn-primary {
            background: var(--button-bg);
            color: white;
            width: 100%;
        }

        .btn-primary:hover {
            background: var(--button-hover);
        }

        .btn-danger {
            background: var(--danger-bg);
            color: white;
        }

        .btn-danger:hover {
            background: var(--danger-hover);
        }

        .btn-secondary {
            background: #444;
            color: white;
        }

        .btn-secondary:hover {
            background: #666;
        }

        #user-management h2 {
            font-family: var(--font-headers);
            color: var(--header-text);
        }

        .user-list {
            list-style: none;
            padding: 0;
        }

        .user-item {
            background: var(--bg-primary);
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 5px solid var(--card-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .user-item.pending {
            border-left-color: #f0ad4e;
        }

        .user-details {
            flex-grow: 1;
        }

        .user-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-basis: 100%;
            justify-content: flex-end;
        }

        @media (min-width: 600px) {
            .user-actions {
                flex-basis: auto;
                margin-top: 0;
            }
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="admin-header">
            <i class="fas fa-user-shield"></i> Admin Panel
        </div>

        <!-- Admin Login -->
        <div id="loginSection">
            <input type="text" id="adminUsername" placeholder="Admin Username">
            <input type="password" id="adminPassword" placeholder="Admin Password">
            <button id="adminLoginBtn" class="btn-primary">Login</button>
        </div>

        <!-- Admin Panel -->
        <div id="adminPanel" style="display: none;">
            <div id="user-management">
                <h2><i class="fas fa-users-cog"></i> User Management</h2>

                <!-- Create User Form -->
                <h3><i class="fas fa-user-plus"></i> Create New User</h3>
                <input type="text" id="newUsername" placeholder="Username">
                <input type="password" id="newPassword" placeholder="Password">
                <button id="createUserBtn" class="btn-primary">Create User</button>

                <!-- User List -->
                <h3><i class="fas fa-users"></i> Registered Users</h3>
                <ul id="userList" class="user-list">
                    <!-- User items will be injected by JS -->
                </ul>
            </div>
            <button id="adminLogoutBtn" class="btn-danger" style="width: auto; margin-top: 20px;">Logout</button>
        </div>
    </div>

    <script src="db.js"></script>
    <script src="admin.js"></script>
</body>
</html>
